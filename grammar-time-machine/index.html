<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Grammar Time Machine Storybook</title>
    <meta name="description" content="An interactive ESL grammar storybook for A1-A2 learners with mini-games and activities.">
    <link rel="stylesheet" href="./style.css">
    <style>
        body {
            font-family: 'Nunito', sans-serif;
            transition: filter 1.2s ease-in-out;
        }
        body.grayscale-mode {
            filter: grayscale(100%) sepia(20%);
        }
        .super-s {
            color: #FF6B6B;
            font-weight: 800;
            font-size: 1.3em;
            text-shadow: 1px 1px 0 #FFE66D;
            display: inline-block;
            animation: wiggle 1s ease-in-out infinite;
        }
        .book-shadow {
            box-shadow:
                0 0 0 1px rgba(139, 94, 60, 0.1),
                0 10px 40px rgba(0,0,0,0.15),
                inset 0 0 80px rgba(139, 94, 60, 0.03);
        }
        .chapter-dot {
            transition: all 0.3s ease;
        }
        .chapter-dot.active {
            transform: scale(1.4);
        }
        .match-card {
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .match-card:hover {
            transform: translateY(-3px);
        }
        .match-card.selected {
            transform: scale(1.08);
            box-shadow: 0 0 0 3px #4ECDC4, 0 5px 20px rgba(78,205,196,0.3);
        }
        .match-card.correct {
            background: #D1FAE5 !important;
            border-color: #34D399 !important;
            box-shadow: 0 0 0 3px #34D399;
        }
        .match-card.incorrect {
            background: #FEE2E2 !important;
            border-color: #F87171 !important;
            animation: wiggle 0.5s ease-in-out;
        }
        .match-card.matched {
            opacity: 0.6;
            pointer-events: none;
            transform: scale(0.95);
        }
        .quiz-btn {
            transition: all 0.2s ease;
        }
        .quiz-btn:hover {
            transform: scale(1.05);
        }
        .quiz-btn.correct-answer {
            background: #34D399 !important;
            color: white !important;
            transform: scale(1.1);
        }
        .quiz-btn.wrong-answer {
            background: #F87171 !important;
            color: white !important;
            animation: wiggle 0.4s ease-in-out;
        }
        .preposition-scene {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto;
        }
        .time-machine-btn {
            background: linear-gradient(135deg, #A78BFA 0%, #7C3AED 50%, #4C1D95 100%);
            box-shadow: 0 0 30px rgba(167, 139, 250, 0.5), 0 0 60px rgba(167, 139, 250, 0.2);
            transition: all 0.3s ease;
        }
        .time-machine-btn:hover {
            box-shadow: 0 0 40px rgba(167, 139, 250, 0.7), 0 0 80px rgba(167, 139, 250, 0.3);
            transform: scale(1.05);
        }
        .time-machine-btn:active {
            transform: scale(0.97);
        }
        .nav-btn {
            transition: all 0.2s ease;
        }
        .nav-btn:hover:not(:disabled) {
            transform: scale(1.1);
        }
        .nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .page-enter {
            animation: slide-up 0.5s ease-out;
        }
        .verb-table tr:hover {
            background: #FEF3C7;
        }
        /* Hide scrollbar but allow scroll */
        .chapter-content::-webkit-scrollbar {
            width: 6px;
        }
        .chapter-content::-webkit-scrollbar-track {
            background: transparent;
        }
        .chapter-content::-webkit-scrollbar-thumb {
            background: #D5C4A1;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-storybook-bg min-h-screen flex items-center justify-center p-4">
    <!-- BOOK CONTAINER -->
    <div id="book" class="w-full max-w-4xl mx-auto">
        <!-- Book Title / Cover -->
        <div class="text-center mb-6">
            <h1 class="font-bubblegum text-4xl md:text-5xl text-storybook-dark mb-2">
                📖 The Grammar Time Machine Storybook
            </h1>
            <p class="text-lg text-gray-500 font-nunito">An adventure through English grammar! ✨</p>
        </div>

        <!-- Book Pages -->
        <div class="bg-storybook-page rounded-3xl book-shadow overflow-hidden relative">
            <!-- Chapter Progress Dots -->
            <div class="flex justify-center gap-2 pt-5 pb-2 px-4 flex-wrap" id="progress-dots"></div>

            <!-- Chapter Content Area -->
            <div id="chapter-content" class="chapter-content px-6 md:px-12 py-6 min-h-[500px] max-h-[65vh] overflow-y-auto">
                <!-- Dynamic content goes here -->
            </div>

            <!-- Navigation -->
            <div class="flex items-center justify-between px-6 md:px-12 py-4 bg-gradient-to-t from-amber-50/80 to-transparent border-t border-amber-100">
                <button id="prev-btn" class="nav-btn bg-white text-storybook-dark rounded-full w-12 h-12 flex items-center justify-center text-xl font-bold shadow-md hover:shadow-lg border-2 border-amber-200" onclick="prevChapter()">
                    ◀
                </button>
                <span id="page-indicator" class="font-bubblegum text-gray-400 text-sm"></span>
                <button id="next-btn" class="nav-btn bg-white text-storybook-dark rounded-full w-12 h-12 flex items-center justify-center text-xl font-bold shadow-md hover:shadow-lg border-2 border-amber-200" onclick="nextChapter()">
                    ▶
                </button>
            </div>
        </div>
    </div>

    <script type="module" src="./game.js"></script>
</body></html>
