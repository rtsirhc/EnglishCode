<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌍 Escape Planet Earth — Teacher Dashboard</title>
  <link rel="stylesheet" href="css/shared.css">
  <link rel="stylesheet" href="css/teacher.css">
</head>
<body>
  <div class="teacher-container">
    <!-- Header -->
    <div class="teacher-header">
      <h1>🌍 Escape Planet Earth</h1>
      <p class="subtitle">Teacher Dashboard</p>
    </div>

    <div class="card" id="room-create-panel">
      <label for="mode">Connection</label>
      <select id="mode" class="input-field">
        <option value="local">Same browser · multiple tabs</option>
        <option value="online">Separate devices · internet</option>
      </select>
      <button id="create-room" class="btn mt-2">Create Room</button>
      <p id="room-status" role="status"></p>
    </div>
    <!-- Setup Section (before game starts) -->
    <div id="setup-section" class="setup-section hidden">
      <div class="card">
        <p class="text-center text-secondary mb-2" id="join-guidance"></p>
        <div class="text-center">
          <div class="room-code-display" id="room-code-display">------</div>
        </div>
        <div class="text-center">
          <div class="qr-container" id="qr-container"></div>
        </div>
        <a class="join-url text-center" id="join-url" target="_blank" rel="noopener"></a>
      </div>

      <div class="teams-section" id="waiting-teams">
        <div class="teams-header">
          <h2>👥 Teams Joined</h2>
          <span class="teams-count" id="teams-count">0</span>
        </div>
        <div id="waiting-teams-list">
          <p class="no-teams">Waiting for teams to join...</p>
        </div>
      </div>

      <div class="text-center">
        <button class="btn btn--large start-btn" id="start-btn" disabled>
          🚀 Start Game
        </button>

      </div>
    </div>

    <!-- Active Game Section -->
    <div id="game-section" class="hidden">
      <div class="teams-section">
        <div class="teams-header">
          <h2>🏆 Leaderboard</h2>
          <span class="teams-count" id="active-teams-count">0</span>
        </div>
        <div id="leaderboard"></div>
      </div>

      <div class="new-game-section">
        <button class="btn btn--danger" id="new-game">🔄 New Game</button>
      </div>
    </div>
  </div>

  <script src="/qrcode.js"></script>
  <script type="module" src="js/teacher.js"></script>
</body>
</html>
