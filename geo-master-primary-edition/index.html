<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geo Master: Primary Edition</title>
  <meta name="description" content="A fun geography quiz game for primary learners! Test your knowledge of maps, population, resources, and more!" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-main-1:     #E0F7FA;
      --bg-main-2:     #F3E5F5;
      --bg-main-3:     #FFF9C4;
      --bg-card:       #FFFFFF;
      --bg-card-hover: #FAFAFA;
      --border:        #E0E7EE;
      --border-accent: #C5CAE9;

      --primary:       #7C4DFF;
      --primary-soft:  #EDE7F6;
      --pink:          #FF4081;
      --pink-soft:     #FCE4EC;
      --teal:          #00BCD4;
      --teal-soft:     #E0F7FA;
      --yellow:        #FFD740;
      --yellow-soft:   #FFFDE7;
      --orange:        #FF6D00;
      --orange-soft:   #FFF3E0;
      --green:         #00C853;
      --green-soft:    #E8F5E9;
      --red:           #FF5252;
      --red-soft:      #FFEBEE;

      --text-dark:     #37474F;
      --text-medium:   #607D8B;
      --text-light:    #B0BEC5;

      --shadow:        0 4px 24px rgba(0,0,0,0.07);
      --shadow-lg:     0 8px 40px rgba(0,0,0,0.10);
      --shadow-glow-green: 0 4px 20px rgba(0,200,83,0.25);
      --shadow-glow-red:   0 4px 20px rgba(255,82,82,0.25);
      --shadow-glow-primary: 0 4px 20px rgba(124,77,255,0.3);

      --radius:        16px;
      --radius-lg:     24px;
      --radius-pill:   999px;
    }

    html, body, #root {
      width: 100%; height: 100%; min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-main-1) 0%, var(--bg-main-2) 50%, var(--bg-main-3) 100%);
      color: var(--text-dark);
      font-family: 'Nunito', sans-serif;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-accent); border-radius: 4px; }

    #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    #root { position: relative; z-index: 1; }

    /* ── Layout ── */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Top Bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255,255,255,0.85);
      border-bottom: 2px solid var(--border);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem; font-weight: 700;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .topbar-stats { display: flex; gap: 16px; align-items: center; }
    .stat-pill {
      display: flex; align-items: center; gap: 8px;
      background: var(--primary-soft);
      border: 1.5px solid var(--border-accent);
      border-radius: var(--radius); padding: 6px 14px;
      font-family: 'Fredoka', sans-serif; font-size: 0.95rem; font-weight: 600;
    }
    .stat-label { color: var(--text-medium); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .stat-value { color: var(--text-dark); font-size: 1.05rem; font-weight: 700; }
    .stat-value.primary { color: var(--primary); }
    .stat-value.teal    { color: var(--teal); }
    .lives-display { font-size: 1.2rem; letter-spacing: 3px; }

    /* ── Main Content ── */
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

    /* ── Cards ── */
    .card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 100%; max-width: 780px;
      position: relative; overflow: hidden;
      box-shadow: var(--shadow);
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, var(--primary), var(--pink), var(--teal), var(--yellow));
      border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    }

    /* ── Start Screen ── */
    .start-screen { text-align: center; max-width: 720px; }
    .start-icon { font-size: 4rem; margin-bottom: 12px; display: block; animation: bounce-slow 2s ease-in-out infinite; }
    @keyframes bounce-slow { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    .start-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(2rem, 5vw, 3.2rem);
      font-weight: 700; line-height: 1.1;
      background: linear-gradient(135deg, var(--primary), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .start-subtitle {
      font-family: 'Fredoka', sans-serif;
      font-size: 1.2rem; font-weight: 600;
      color: var(--teal);
      letter-spacing: 2px; margin-bottom: 28px;
      text-transform: uppercase;
    }
    .start-desc {
      color: var(--text-medium); font-size: 1rem; line-height: 1.7;
      margin-bottom: 28px;
    }
    .rules-grid {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 12px; margin-bottom: 28px; text-align: left;
    }
    @media (max-width: 600px) { .rules-grid { grid-template-columns: 1fr; } }
    .rule-item {
      background: var(--primary-soft);
      border: 1.5px solid var(--border-accent);
      border-radius: var(--radius);
      padding: 16px;
      display: flex; gap: 10px; align-items: flex-start;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .rule-item:hover { transform: translateY(-2px); box-shadow: var(--shadow); }
    .rule-icon { font-size: 1.6rem; flex-shrink: 0; }
    .rule-text { font-size: 0.88rem; color: var(--text-dark); line-height: 1.5; font-weight: 600; }
    .rule-text strong { color: var(--primary); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 32px; border: none; border-radius: var(--radius);
      font-family: 'Fredoka', sans-serif; font-size: 1.1rem; font-weight: 700;
      letter-spacing: 1px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
      position: relative; overflow: hidden;
    }
    .btn:active { transform: scale(0.96); }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary), #651FFF);
      color: #fff; box-shadow: var(--shadow-glow-primary);
    }
    .btn-primary:hover { box-shadow: 0 6px 30px rgba(124,77,255,0.45); transform: translateY(-2px); }

    .btn-green {
      background: linear-gradient(135deg, var(--green), #00A046);
      color: #fff; box-shadow: var(--shadow-glow-green);
    }
    .btn-green:hover { box-shadow: 0 6px 30px rgba(0,200,83,0.45); transform: translateY(-2px); }

    .btn-pink {
      background: linear-gradient(135deg, var(--pink), #C51162);
      color: #fff; box-shadow: var(--shadow-glow-red);
    }
    .btn-pink:hover { box-shadow: 0 6px 30px rgba(255,64,129,0.45); transform: translateY(-2px); }

    .btn-ghost {
      background: rgba(124,77,255,0.08);
      border: 1.5px solid var(--border-accent);
      color: var(--primary);
    }
    .btn-ghost:hover { background: rgba(124,77,255,0.15); }

    .btn-lg { padding: 18px 48px; font-size: 1.25rem; border-radius: 20px; }

    /* ── Question Timer Ring ── */
    .q-timer-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
    }
    .q-timer-ring { width: 72px; height: 72px; position: relative; }
    .q-timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .q-timer-ring circle {
      fill: none; stroke-width: 6; stroke-linecap: round;
      transition: stroke-dashoffset 0.4s linear, stroke 0.4s;
    }
    .q-timer-ring .bg-circle { stroke: var(--border); }
    .q-timer-ring .fg-circle { stroke: var(--teal); }
    .q-timer-ring .fg-circle.danger { stroke: var(--red); }
    .q-timer-num {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'Fredoka', sans-serif; font-size: 1.2rem; font-weight: 700;
      color: var(--teal);
    }
    .q-timer-num.danger { color: var(--red); animation: pulse-danger 0.5s infinite alternate; }
    @keyframes pulse-danger { from { transform: scale(1); } to { transform: scale(1.15); } }

    /* ── Question Header ── */
    .q-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .q-badges { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .q-type-badge {
      font-family: 'Fredoka', sans-serif; font-size: 0.78rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 1.5px;
      padding: 5px 14px; border-radius: var(--radius-pill);
    }
    .badge-fill { background: var(--teal-soft); color: var(--teal); border: 1.5px solid #B2EBF2; }
    .badge-mc   { background: var(--primary-soft); color: var(--primary); border: 1.5px solid #D1C4E9; }
    .badge-fix  { background: var(--orange-soft); color: var(--orange); border: 1.5px solid #FFE0B2; }

    .q-theme-badge {
      font-family: 'Nunito', sans-serif; font-size: 0.75rem; font-weight: 700;
      padding: 4px 12px; border-radius: var(--radius-pill);
      background: var(--yellow-soft); color: #F57F17;
      border: 1.5px solid #FFF176;
    }

    /* ── Question Sentence ── */
    .q-sentence {
      font-family: 'Nunito', sans-serif;
      font-size: clamp(1.05rem, 2.2vw, 1.3rem);
      font-weight: 700; line-height: 1.7;
      color: var(--text-dark);
      background: linear-gradient(135deg, #F5F7FF, #FFF8F0);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
    }
    .blank {
      display: inline-block;
      border-bottom: 3px solid var(--primary);
      min-width: 90px; color: transparent;
      user-select: none;
    }

    /* ── Instruction ── */
    .instruction {
      font-size: 0.92rem; color: var(--text-medium); font-weight: 600;
      margin-bottom: 16px; line-height: 1.5;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .instruction::before { content: '👉'; flex-shrink: 0; }

    /* ── MC Grid ── */
    .mc-grid {
      display: flex; flex-direction: column;
      gap: 10px;
    }
    .mc-btn {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      min-height: 56px;
      font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700;
      color: var(--text-dark); text-align: left;
      cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center;
    }
    .mc-btn:hover:not(:disabled) {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
      transform: translateX(4px);
    }
    .mc-btn.correct {
      background: var(--green-soft);
      border-color: var(--green);
      color: #1B5E20;
      box-shadow: var(--shadow-glow-green);
    }
    .mc-btn.wrong {
      background: var(--red-soft);
      border-color: var(--red);
      color: #B71C1C;
    }
    .mc-btn:disabled { cursor: default; }
    .mc-btn .mc-letter {
      display: inline-flex; align-items: center; justify-content: center;
      width: 30px; height: 30px; border-radius: 50%;
      background: var(--primary-soft); color: var(--primary);
      font-family: 'Fredoka', sans-serif; font-size: 0.85rem; font-weight: 700;
      margin-right: 14px; flex-shrink: 0;
    }
    .mc-btn.correct .mc-letter { background: var(--green-soft); color: #1B5E20; }
    .mc-btn.wrong .mc-letter { background: var(--red-soft); color: #B71C1C; }

    /* ── Fill-in Input ── */
    .fill-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .fill-input {
      flex: 1; min-width: 200px;
      background: #F5F7FF;
      border: 2px solid var(--border-accent);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-family: 'Nunito', sans-serif; font-size: 1.05rem; font-weight: 700;
      color: var(--text-dark);
      outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .fill-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124,77,255,0.15); }
    .fill-input.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
    }

    /* ── Fix Question ── */
    .fix-sentence {
      display: flex; flex-wrap: wrap; gap: 6px;
      background: linear-gradient(135deg, #F5F7FF, #FFF8F0);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 20px; margin-bottom: 16px;
      font-family: 'Nunito', sans-serif; font-size: clamp(1rem, 2vw, 1.2rem); font-weight: 700;
    }
    .fix-word {
      padding: 4px 8px; border-radius: 8px;
      cursor: pointer; transition: all 0.15s;
      border: 2px solid transparent;
      color: var(--text-dark);
    }
    .fix-word:hover { background: var(--orange-soft); border-color: var(--orange); color: var(--orange); }
    .fix-word.selected { background: var(--orange-soft); border-color: var(--orange); color: var(--orange); }
    .fix-correction { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    .fix-hint { font-size: 0.88rem; color: var(--text-medium); margin-bottom: 10px; font-weight: 600; }

    /* ── Answer Reveal ── */
    .answer-reveal {
      background: var(--green-soft);
      border: 1.5px solid #A5D6A7;
      border-radius: var(--radius);
      padding: 14px 18px; margin-top: 14px;
      font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700;
      color: #1B5E20;
    }
    .answer-reveal.wrong-reveal {
      background: var(--red-soft);
      border-color: #EF9A9A;
      color: #B71C1C;
    }

    /* ── Feedback Overlay ── */
    .feedback-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .feedback-toast {
      font-family: 'Fredoka', sans-serif; font-size: 2.2rem; font-weight: 700;
      padding: 20px 40px; border-radius: 20px;
      animation: toast-in 0.3s ease, toast-out 0.3s ease 0.7s forwards;
      pointer-events: none;
    }
    .feedback-toast.correct {
      color: #1B5E20; background: var(--green-soft);
      border: 3px solid var(--green); box-shadow: var(--shadow-glow-green);
    }
    .feedback-toast.wrong {
      color: #B71C1C; background: var(--red-soft);
      border: 3px solid var(--red); box-shadow: var(--shadow-glow-red);
    }
    @keyframes toast-in  { from { transform: scale(0.5) rotate(-5deg); opacity: 0; } to { transform: scale(1) rotate(0); opacity: 1; } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; transform: translateY(-20px); } }

    /* ── Progress Bar ── */
    .progress-bar-wrap { width: 100%; max-width: 780px; margin-bottom: 14px; }
    .progress-bar-bg { background: var(--border); border-radius: var(--radius-pill); height: 8px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%; border-radius: var(--radius-pill);
      background: linear-gradient(90deg, var(--primary), var(--pink), var(--teal));
      transition: width 0.4s ease;
    }

    /* ── End Screens ── */
    .end-screen { text-align: center; }
    .end-icon { font-size: 5rem; margin-bottom: 16px; display: block; animation: bounce-slow 2s ease-in-out infinite; }
    .end-title {
      font-family: 'Fredoka', sans-serif;
      font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700;
      margin-bottom: 10px;
    }
    .end-title.defeat {
      background: linear-gradient(135deg, var(--orange), var(--pink));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .end-title.victory {
      background: linear-gradient(135deg, var(--green), var(--teal));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .end-sub { font-family: 'Nunito', sans-serif; font-size: 1.1rem; color: var(--text-medium); margin-bottom: 24px; font-weight: 600; line-height: 1.6; }
    .final-time {
      font-family: 'Fredoka', sans-serif; font-size: 2.5rem; font-weight: 700;
      color: var(--primary);
      margin-bottom: 24px;
    }
    .new-record {
      color: var(--yellow); font-size: 1rem; font-weight: 700;
      letter-spacing: 2px; margin-bottom: 12px;
      text-shadow: 0 0 8px rgba(255,215,0,0.5);
      font-family: 'Fredoka', sans-serif;
    }

    /* ── Leaderboard ── */
    .leaderboard { margin-bottom: 24px; text-align: left; }
    .lb-title {
      font-family: 'Fredoka', sans-serif; font-size: 0.9rem; font-weight: 700;
      color: var(--primary); letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 12px; text-align: center;
    }
    .lb-row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px; border-radius: var(--radius);
      margin-bottom: 6px;
      background: var(--bg-card);
      border: 1.5px solid var(--border);
      font-family: 'Nunito', sans-serif; font-size: 0.95rem; font-weight: 700;
    }
    .lb-row.highlight { border-color: var(--primary); background: var(--primary-soft); }
    .lb-rank { font-family: 'Fredoka', sans-serif; font-size: 1rem; width: 28px; text-align: center; }
    .lb-time { font-family: 'Fredoka', sans-serif; font-size: 1.05rem; color: var(--teal); margin-left: auto; }
    .lb-date { font-size: 0.8rem; color: var(--text-light); }
    .lb-empty { color: var(--text-light); font-size: 0.9rem; padding: 16px 0; text-align: center; }

    /* ── Utilities ── */
    .mt-12 { margin-top: 12px; }
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .flex-center { display: flex; justify-content: center; align-items: center; gap: 12px; }

    /* ── Confetti canvas ── */
    #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 300; }
  </style>
</head>
<body>
<canvas id="bubbles"></canvas>
<canvas id="confetti"></canvas>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ═══════════════════════════════════════════════════════════════
// BUBBLE PARTICLE SYSTEM
// ═══════════════════════════════════════════════════════════════
(function initBubbles() {
  const canvas = document.getElementById('bubbles');
  const ctx = canvas.getContext('2d');
  let W, H, particles = [];
  const COLORS = ['rgba(124,77,255,0.12)','rgba(255,64,129,0.10)','rgba(0,188,212,0.10)','rgba(255,215,64,0.12)','rgba(0,200,83,0.10)'];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for (let i = 0; i < 30; i++) {
    particles.push({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 12 + 4,
      dx: (Math.random() - 0.5) * 0.3,
      dy: (Math.random() - 0.5) * 0.3,
      color: COLORS[Math.floor(Math.random() * COLORS.length)],
    });
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = p.color;
      ctx.fill();
      p.x += p.dx; p.y += p.dy;
      if (p.x < -20 || p.x > W+20) p.dx *= -1;
      if (p.y < -20 || p.y > H+20) p.dy *= -1;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ═══════════════════════════════════════════════════════════════
// CONFETTI SYSTEM
// ═══════════════════════════════════════════════════════════════
const confettiSystem = (() => {
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  let particles = [], animId = null;
  const COLORS = ['#7C4DFF','#FF4081','#00BCD4','#FFD740','#00C853','#FF6D00'];

  function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
  resize(); window.addEventListener('resize', resize);

  function launch() {
    particles = [];
    for (let i = 0; i < 120; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height * 0.5 - canvas.height * 0.3,
        r: Math.random() * 6 + 3,
        dx: (Math.random() - 0.5) * 6,
        dy: Math.random() * 3 + 2,
        rot: Math.random() * 360,
        dr: (Math.random() - 0.5) * 8,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        life: 1,
      });
    }
    if (animId) cancelAnimationFrame(animId);
    draw();
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      if (p.life <= 0) return;
      alive = true;
      p.x += p.dx; p.y += p.dy; p.dy += 0.08;
      p.rot += p.dr; p.life -= 0.005;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot * Math.PI / 180);
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.r/2, -p.r/2, p.r, p.r * 0.6);
      ctx.restore();
    });
    if (alive) animId = requestAnimationFrame(draw);
  }

  return { launch };
})();

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatTime(secs) {
  const m = Math.floor(secs / 60).toString().padStart(2,'0');
  const s = (secs % 60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

function getLSLeaderboard() {
  try { const d = localStorage.getItem('gm_primary_lb'); return d ? JSON.parse(d) : []; }
  catch { return []; }
}
function saveLSLeaderboard(lb) {
  try { localStorage.setItem('gm_primary_lb', JSON.stringify(lb)); } catch {}
}
function addToLeaderboard(timeSecs) {
  const lb = getLSLeaderboard();
  lb.push({ time: timeSecs, date: new Date().toLocaleDateString() });
  lb.sort((a,b) => a.time - b.time);
  const trimmed = lb.slice(0, 10);
  saveLSLeaderboard(trimmed);
  return trimmed;
}

function getTimerMax(type) {
  if (type === 'mc')   return 25;
  if (type === 'fill') return 30;
  if (type === 'fix')  return 40;
  return 25;
}

function checkFillAnswer(userInput, q) {
  const user = userInput.trim().toLowerCase();
  const correct = q.answer.toLowerCase();
  if (user === correct) return true;
  if (q.alts && q.alts.some(alt => user === alt.toLowerCase())) return true;
  return false;
}

function checkFixCorrection(userInput, q) {
  const user = userInput.trim().toLowerCase();
  const correct = q.correction.toLowerCase();
  if (user === correct) return true;
  if (q.corrAlts && q.corrAlts.some(alt => user === alt.toLowerCase())) return true;
  // Also accept without hyphens
  if (user.replace(/-/g,' ') === correct.replace(/-/g,' ')) return true;
  if (user.replace(/[-\s]/g,'') === correct.replace(/[-\s]/g,'')) return true;
  return false;
}

const CORRECT_MSGS = ['⭐ Brilliant!','🌟 Amazing!','✨ Perfect!','🎉 Great Job!','👏 Well Done!'];
const WRONG_MSGS = ['Not quite! 💪','Oops! 😊','Almost! 🤔','Keep trying! 💫'];
function randomMsg(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function QuestionTimer({ value, max, danger }) {
  const radius = 30;
  const circumference = 2 * Math.PI * radius;
  const offset = circumference - (value / max) * circumference;
  return (
    <div className="q-timer-wrap">
      <div className="q-timer-ring">
        <svg viewBox="0 0 72 72">
          <circle className="bg-circle" cx="36" cy="36" r={radius} strokeDasharray={circumference} />
          <circle className={`fg-circle${danger?' danger':''}`} cx="36" cy="36" r={radius}
            strokeDasharray={circumference} strokeDashoffset={offset} />
        </svg>
        <div className={`q-timer-num${danger?' danger':''}`}>{value}</div>
      </div>
    </div>
  );
}

function Lives({ count }) {
  return (
    <span className="lives-display">
      {Array.from({length:3}).map((_,i) => (
        <span key={i} style={{opacity: i < count ? 1 : 0.2, transition:'opacity 0.3s, transform 0.3s', display:'inline-block', transform: i < count ? 'scale(1)' : 'scale(0.7)'}}>❤️</span>
      ))}
    </span>
  );
}

function FeedbackToast({ feedback }) {
  if (!feedback) return null;
  return (
    <div className="feedback-overlay">
      <div className={`feedback-toast ${feedback.correct ? 'correct' : 'wrong'}`}>
        {feedback.correct ? randomMsg(CORRECT_MSGS) : randomMsg(WRONG_MSGS)}
      </div>
    </div>
  );
}

function Leaderboard({ entries, highlightTime }) {
  const medals = ['🥇','🥈','🥉','4','5'];
  const top5 = entries.slice(0,5);
  return (
    <div className="leaderboard">
      <div className="lb-title">🏆 Top 5 Fastest Times</div>
      {top5.length === 0
        ? <div className="lb-empty">No records yet — be the first! 🌟</div>
        : top5.map((e,i) => (
          <div key={i} className={`lb-row${e.time===highlightTime?' highlight':''}`}>
            <span className="lb-rank">{medals[i]}</span>
            <span style={{flex:1, color:'var(--text-medium)', fontSize:'0.85rem'}}>{e.date}</span>
            <span className="lb-time">{formatTime(e.time)}</span>
          </div>
        ))
      }
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// QUESTION RENDERERS
// ═══════════════════════════════════════════════════════════════

function MCQuestion({ q, onAnswer, disabled, result }) {
  const LETTERS = ['A','B','C','D'];
  return (
    <div>
      <p className="instruction">Read the question and choose the best answer.</p>
      <div className="q-sentence">{q.question}</div>
      <div className="mc-grid">
        {q.options.map((opt, idx) => {
          let cls = 'mc-btn';
          if (disabled) {
            if (opt === q.answer) cls += ' correct';
            else if (result && result.selected === opt) cls += ' wrong';
          }
          return (
            <button key={opt} className={cls} onClick={() => !disabled && onAnswer(opt)} disabled={disabled}>
              <span className="mc-letter">{LETTERS[idx]}</span>
              {opt}
            </button>
          );
        })}
      </div>
      {disabled && result && !result.correct && (
        <div className="answer-reveal mt-16">
          ✅ The correct answer is: <strong>{q.answer}</strong>
        </div>
      )}
    </div>
  );
}

function FillInQuestion({ q, onAnswer, disabled, result }) {
  const [val, setVal] = useState('');
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { if (inputRef.current) inputRef.current.focus(); }, []);

  function submit() {
    if (disabled || !val.trim()) return;
    const correct = checkFillAnswer(val, q);
    if (!correct) { setShake(true); setTimeout(()=>setShake(false), 500); }
    onAnswer({ value: val.trim(), correct });
  }

  const parts = q.sentence.split('___');

  return (
    <div>
      <p className="instruction">Read the sentence and type the missing word. Press Enter to submit.</p>
      <div className="q-sentence">
        {parts[0]}<span className="blank">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>{parts[1]}
      </div>
      <div className="fill-form">
        <input
          ref={inputRef}
          className={`fill-input${shake?' shake':''}`}
          value={val}
          onChange={e => setVal(e.target.value)}
          onKeyDown={e => e.key==='Enter' && submit()}
          placeholder="Type your answer…"
          disabled={disabled}
          autoComplete="off"
        />
        <button className="btn btn-primary" onClick={submit} disabled={disabled}>Submit</button>
      </div>
      {disabled && result && (
        <div className={`answer-reveal mt-16${!result.correct?' wrong-reveal':''}`}>
          {result.correct
            ? <>✅ Correct! The answer is: <strong>"{q.answer}"</strong></>
            : <>❌ The correct answer is: <strong>"{q.answer}"</strong></>
          }
        </div>
      )}
    </div>
  );
}

function FixQuestion({ q, onAnswer, disabled, result }) {
  const words = q.sentenceWithError.split(' ');
  const [selected, setSelected] = useState(null);
  const [correction, setCorrection] = useState('');
  const [shake, setShake] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => { if (selected !== null && inputRef.current) inputRef.current.focus(); }, [selected]);

  function submit() {
    if (disabled || selected === null || !correction.trim()) return;
    const pickedWord = words[selected].replace(/[.,!?;:'"]/g, '');
    const isRightWord = pickedWord.toLowerCase() === q.errorWord.toLowerCase();
    const isRightFix  = checkFixCorrection(correction, q);
    if (isRightWord && isRightFix) {
      onAnswer({ correct: true });
    } else {
      setShake(true); setTimeout(()=>setShake(false), 500);
      onAnswer({ correct: false });
    }
  }

  return (
    <div>
      <p className="instruction">This sentence has a mistake! Click the wrong word, then type the correction and press Enter.</p>
      <div className="fix-sentence">
        {words.map((w, i) => (
          <span key={i}
            className={`fix-word${selected===i?' selected':''}`}
            onClick={() => !disabled && setSelected(i)}
          >{w}</span>
        ))}
      </div>
      {selected !== null && !disabled && (
        <div className="fix-correction">
          <div className="fix-hint">You selected: <strong style={{color:'var(--orange)'}}>{words[selected]}</strong> — type the correction:</div>
          <input
            ref={inputRef}
            className={`fill-input${shake?' shake':''}`}
            value={correction}
            onChange={e=>setCorrection(e.target.value)}
            onKeyDown={e=>e.key==='Enter'&&submit()}
            placeholder="Corrected word…"
            style={{maxWidth:'320px'}}
            autoComplete="off"
          />
          <button className="btn btn-primary" onClick={submit}>Submit</button>
        </div>
      )}
      {disabled && (
        <div className={`answer-reveal mt-16${result && !result.correct?' wrong-reveal':''}`}>
          {result && result.correct
            ? <>✅ Correct! "<strong>{q.errorWord}</strong>" → "<strong>{q.correction}</strong>"</>
            : <>❌ The mistake was "<strong>{q.errorWord}</strong>" → it should be "<strong>{q.correction}</strong>"</>
          }
        </div>
      )}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN GAME COMPONENT
// ═══════════════════════════════════════════════════════════════

const TOTAL_QUESTIONS = 20;

function App() {
  const [gameState, setGameState] = useState('start');
  const [lives, setLives] = useState(3);
  const [globalTimer, setGlobalTimer] = useState(0);
  const [questionTimer, setQuestionTimer] = useState(0);
  const [currentIndex, setCurrentIndex] = useState(0);
  const [roundQuestions, setRoundQuestions] = useState([]);
  const [feedback, setFeedback] = useState(null);
  const [questionResult, setQuestionResult] = useState(null);
  const [questionLocked, setQuestionLocked] = useState(false);
  const [leaderboard, setLeaderboard] = useState(getLSLeaderboard());
  const [finalTime, setFinalTime] = useState(null);
  const [newRecord, setNewRecord] = useState(false);

  const globalIntervalRef = useRef(null);
  const questionIntervalRef = useRef(null);
  const globalTimerRef = useRef(0);
  const livesRef = useRef(3);
  const questionLockedRef = useRef(false);
  const currentIndexRef = useRef(0);

  function startGame() {
    const selected = shuffle(Q_BANK).slice(0, TOTAL_QUESTIONS);
    // Shuffle MC options
    const prepared = selected.map(q => {
      if (q.type === 'mc') return { ...q, options: shuffle([...q.options]) };
      return q;
    });
    setRoundQuestions(prepared);
    setCurrentIndex(0);     currentIndexRef.current = 0;
    setLives(3);            livesRef.current = 3;
    setGlobalTimer(0);      globalTimerRef.current = 0;
    setQuestionResult(null);
    setFeedback(null);
    setQuestionLocked(false); questionLockedRef.current = false;
    setFinalTime(null);
    setNewRecord(false);
    setGameState('playing');
  }

  // Global timer
  useEffect(() => {
    if (gameState === 'playing') {
      globalIntervalRef.current = setInterval(() => {
        globalTimerRef.current += 1;
        setGlobalTimer(t => t + 1);
      }, 1000);
    } else {
      clearInterval(globalIntervalRef.current);
    }
    return () => clearInterval(globalIntervalRef.current);
  }, [gameState]);

  // Question timer
  const currentQ = roundQuestions[currentIndex];

  useEffect(() => {
    if (gameState !== 'playing' || !currentQ || questionLockedRef.current) {
      clearInterval(questionIntervalRef.current);
      return;
    }
    const max = getTimerMax(currentQ.type);
    setQuestionTimer(max);
    clearInterval(questionIntervalRef.current);
    questionIntervalRef.current = setInterval(() => {
      setQuestionTimer(t => {
        if (t <= 1) {
          clearInterval(questionIntervalRef.current);
          handleTimeout();
          return 0;
        }
        return t - 1;
      });
    }, 1000);
    return () => clearInterval(questionIntervalRef.current);
  }, [currentIndex, gameState]);

  function handleTimeout() {
    if (questionLockedRef.current) return;
    questionLockedRef.current = true;
    setQuestionLocked(true);
    setFeedback({ correct: false });
    setQuestionResult({ correct: false, timeout: true });
    processResult(false);
  }

  function processResult(correct) {
    const prevLives = livesRef.current;
    const nextLives = correct ? prevLives : prevLives - 1;
    livesRef.current = nextLives < 0 ? 0 : nextLives;
    setLives(livesRef.current);

    if (!correct && livesRef.current <= 0) {
      setTimeout(() => setGameState('gameover'), 1200);
      setTimeout(() => setFeedback(null), 1200);
      return;
    }
    setTimeout(() => {
      setFeedback(null);
      advanceQuestion();
    }, 1200);
  }

  function advanceQuestion() {
    questionLockedRef.current = false;
    setQuestionLocked(false);
    setQuestionResult(null);
    const nextIndex = currentIndexRef.current + 1;
    if (nextIndex >= TOTAL_QUESTIONS) {
      const elapsed = globalTimerRef.current;
      const lb = addToLeaderboard(elapsed);
      const isNew = lb[0] && lb[0].time === elapsed;
      setFinalTime(elapsed);
      setNewRecord(isNew);
      setLeaderboard(lb);
      confettiSystem.launch();
      setGameState('victory');
    } else {
      currentIndexRef.current = nextIndex;
      setCurrentIndex(nextIndex);
    }
  }

  // MC answer
  function handleMCAnswer(answer) {
    if (questionLockedRef.current || gameState !== 'playing') return;
    clearInterval(questionIntervalRef.current);
    questionLockedRef.current = true;
    setQuestionLocked(true);
    const correct = answer === currentQ.answer;
    setQuestionResult({ correct, selected: answer });
    setFeedback({ correct });
    processResult(correct);
  }

  // Fill-in answer
  function handleFillAnswer(ansObj) {
    if (questionLockedRef.current || gameState !== 'playing') return;
    clearInterval(questionIntervalRef.current);
    questionLockedRef.current = true;
    setQuestionLocked(true);
    setQuestionResult({ correct: ansObj.correct });
    setFeedback({ correct: ansObj.correct });
    processResult(ansObj.correct);
  }

  // Fix answer
  function handleFixAnswer(ansObj) {
    if (questionLockedRef.current || gameState !== 'playing') return;
    clearInterval(questionIntervalRef.current);
    questionLockedRef.current = true;
    setQuestionLocked(true);
    const correct = ansObj.correct;
    setQuestionResult({ correct });
    setFeedback({ correct });
    processResult(correct);
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: START
  // ═══════════════════════════════════════════════════════════
  if (gameState === 'start') {
    return (
      <div className="app">
        <div className="main">
          <div className="card start-screen">
            <span className="start-icon">🌍</span>
            <h1 className="start-title">GEO MASTER</h1>
            <div className="start-subtitle">Primary Edition</div>
            <p className="start-desc">
              Test your geography knowledge with questions about maps, population, resources, migration, and more!
              Answer 20 questions before you run out of lives. How fast can you finish? ⚡
            </p>

            <div className="rules-grid">
              <div className="rule-item">
                <span className="rule-icon">🔘</span>
                <div className="rule-text"><strong>Multiple Choice</strong><br/>25s — Pick the best answer</div>
              </div>
              <div className="rule-item">
                <span className="rule-icon">📝</span>
                <div className="rule-text"><strong>Fill in the Blank</strong><br/>30s — Type the missing word</div>
              </div>
              <div className="rule-item">
                <span className="rule-icon">🔍</span>
                <div className="rule-text"><strong>Spot the Mistake</strong><br/>40s — Click the error &amp; fix it</div>
              </div>
            </div>

            <button className="btn btn-primary btn-lg" onClick={startGame}>
              🌍 Start Quiz!
            </button>
            <div className="mt-24">
              <Leaderboard entries={leaderboard} />
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: GAME OVER
  // ═══════════════════════════════════════════════════════════
  if (gameState === 'gameover') {
    return (
      <div className="app">
        <div className="main">
          <div className="card end-screen">
            <span className="end-icon">🌎</span>
            <h1 className="end-title defeat">Good Effort!</h1>
            <p className="end-sub">
              You made it to question {currentIndex + 1} of {TOTAL_QUESTIONS}.<br/>
              Keep studying and you'll be a geography expert in no time! 📚✨
            </p>
            <button className="btn btn-primary btn-lg" onClick={startGame}>
              🔄 Try Again
            </button>
            <div style={{marginTop:'12px'}}>
              <button className="btn btn-ghost" onClick={() => setGameState('start')}>← Back to Menu</button>
            </div>
            <div className="mt-24">
              <Leaderboard entries={leaderboard} />
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: VICTORY
  // ═══════════════════════════════════════════════════════════
  if (gameState === 'victory') {
    return (
      <div className="app">
        <div className="main">
          <div className="card end-screen">
            <span className="end-icon">🏆</span>
            <h1 className="end-title victory">CHAMPION!</h1>
            <p className="end-sub">
              You answered all {TOTAL_QUESTIONS} questions with {lives} ❤️ remaining!<br/>
              You're a Geography Superstar! 🌟
            </p>
            {newRecord && (
              <div className="new-record">🌟 NEW PERSONAL BEST! 🌟</div>
            )}
            <div className="final-time">{formatTime(finalTime ?? globalTimer)}</div>
            <button className="btn btn-green btn-lg" onClick={startGame} style={{marginBottom:'12px'}}>
              ⚡ Play Again
            </button>
            <button className="btn btn-ghost" onClick={() => setGameState('start')}>
              ← Back to Menu
            </button>
            <div className="mt-24">
              <Leaderboard entries={leaderboard} highlightTime={finalTime ?? globalTimer} />
            </div>
          </div>
        </div>
      </div>
    );
  }

  // ═══════════════════════════════════════════════════════════
  // RENDER: PLAYING
  // ═══════════════════════════════════════════════════════════
  if (!currentQ) return null;
  const timerMax = getTimerMax(currentQ.type);
  const isDanger = questionTimer < 6 && questionTimer > 0;
  const progress = ((currentIndex) / TOTAL_QUESTIONS) * 100;

  const typeBadge = {
    mc:   'badge-mc',
    fill: 'badge-fill',
    fix:  'badge-fix',
  }[currentQ.type];

  const typeLabel = {
    mc:   '🔘 Multiple Choice',
    fill: '📝 Fill in the Blank',
    fix:  '🔍 Spot the Mistake',
  }[currentQ.type];

  return (
    <div className="app">
      {/* TOP BAR */}
      <div className="topbar">
        <div className="topbar-brand">🌍 GEO MASTER</div>
        <div className="topbar-stats">
          <div className="stat-pill">
            <span className="stat-label">Time</span>
            <span className="stat-value primary">{formatTime(globalTimer)}</span>
          </div>
          <div className="stat-pill">
            <span className="stat-label">Q</span>
            <span className="stat-value">{currentIndex + 1} / {TOTAL_QUESTIONS}</span>
          </div>
          <div className="stat-pill">
            <Lives count={lives} />
          </div>
        </div>
      </div>

      <FeedbackToast feedback={feedback} />

      <div className="main">
        {/* Progress bar */}
        <div className="progress-bar-wrap">
          <div className="progress-bar-bg">
            <div className="progress-bar-fill" style={{width:`${progress}%`}} />
          </div>
        </div>

        <div className="card">
          {/* Question header */}
          <div className="q-header">
            <div className="q-badges">
              <span className={`q-type-badge ${typeBadge}`}>{typeLabel}</span>
              <span className="q-theme-badge">{currentQ.theme}</span>
            </div>
            <QuestionTimer value={questionTimer} max={timerMax} danger={isDanger} />
          </div>

          {/* Question UI */}
          {currentQ.type === 'mc' && (
            <MCQuestion
              key={currentQ.id}
              q={currentQ}
              onAnswer={handleMCAnswer}
              disabled={questionLocked}
              result={questionResult}
            />
          )}
          {currentQ.type === 'fill' && (
            <FillInQuestion
              key={currentQ.id}
              q={currentQ}
              onAnswer={handleFillAnswer}
              disabled={questionLocked}
              result={questionResult}
            />
          )}
          {currentQ.type === 'fix' && (
            <FixQuestion
              key={currentQ.id}
              q={currentQ}
              onAnswer={handleFixAnswer}
              disabled={questionLocked}
              result={questionResult}
            />
          )}
        </div>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
