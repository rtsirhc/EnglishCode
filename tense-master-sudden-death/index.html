<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tense Master: Sudden Death</title>
  <meta name="description" content="A high-stakes English grammar game for B1 learners. Practise eight tense and future forms before time runs out!" />
  
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-dark:       #080b14;
      --bg-panel:      #0d1220;
      --bg-card:       #111827;
      --border:        #1e2d4a;
      --neon-cyan:     #00f5ff;
      --neon-green:    #39ff14;
      --neon-magenta:  #ff2d78;
      --neon-yellow:   #ffe600;
      --neon-orange:   #ff6b00;
      --neon-purple:   #bf5fff;
      --text-primary:  #e8f0fe;
      --text-muted:    #6b7fa3;
      --text-dim:      #3a4d6b;
      --glow-cyan:     0 0 8px #00f5ff, 0 0 20px #00f5ff44;
      --glow-green:    0 0 8px #39ff14, 0 0 20px #39ff1444;
      --glow-magenta:  0 0 8px #ff2d78, 0 0 20px #ff2d7844;
      --glow-yellow:   0 0 8px #ffe600, 0 0 20px #ffe60044;
      --radius:        12px;
      --radius-lg:     18px;
    }

    html, body, #root {
      width: 100%; height: 100%; min-height: 100vh;
      background: var(--bg-dark);
      color: var(--text-primary);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-dark); }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

    /* ── Animated background grid ── */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Scanline overlay ── */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.08) 2px,
        rgba(0,0,0,0.08) 4px
      );
      pointer-events: none; z-index: 0;
    }

    #root { position: relative; z-index: 1; }

    /* ── Layout ── */
    .app { display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Top bar ── */
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: linear-gradient(135deg, rgba(13,18,32,0.95), rgba(17,24,39,0.95));
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
      position: sticky; top: 0; z-index: 100;
    }
    .topbar-brand {
      font-family: 'Orbitron', monospace;
      font-size: 1rem; font-weight: 900;
      color: var(--neon-cyan);
      text-shadow: var(--glow-cyan);
      letter-spacing: 2px;
    }
    .topbar-stats { display: flex; gap: 24px; align-items: center; }
    .stat-pill {
      display: flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px; padding: 6px 14px;
      font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600;
    }
    .stat-label { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; }
    .stat-value { color: var(--text-primary); font-size: 1.1rem; font-weight: 700; }
    .stat-value.cyan   { color: var(--neon-cyan);   text-shadow: var(--glow-cyan); }
    .stat-value.green  { color: var(--neon-green);  text-shadow: var(--glow-green); }
    .stat-value.magenta{ color: var(--neon-magenta); }
    .lives-display { font-size: 1.2rem; letter-spacing: 2px; }

    /* ── Main content ── */
    .main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }

    /* ── Cards / Panels ── */
    .card {
      background: linear-gradient(135deg, var(--bg-panel), var(--bg-card));
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 32px;
      width: 100%; max-width: 760px;
      position: relative; overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    }

    /* ── START SCREEN ── */
    .start-screen { text-align: center; max-width: 700px; }
    .start-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 900; line-height: 1.1;
      color: var(--neon-cyan);
      text-shadow: var(--glow-cyan);
      margin-bottom: 8px;
    }
    .start-subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.3rem; font-weight: 600;
      color: var(--neon-magenta);
      text-shadow: var(--glow-magenta);
      letter-spacing: 3px; margin-bottom: 32px;
      text-transform: uppercase;
    }
    .start-desc {
      color: var(--text-muted); font-size: 1rem; line-height: 1.7;
      margin-bottom: 32px;
    }
    .rules-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 32px; text-align: left;
    }
    .rule-item {
      background: rgba(0,245,255,0.04);
      border: 1px solid rgba(0,245,255,0.15);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex; gap: 10px; align-items: flex-start;
    }
    .rule-icon { font-size: 1.4rem; flex-shrink: 0; }
    .rule-text { font-size: 0.9rem; color: var(--text-primary); line-height: 1.5; }
    .rule-text strong { color: var(--neon-cyan); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 10px;
      padding: 14px 32px; border: none; border-radius: var(--radius);
      font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      cursor: pointer; transition: all 0.2s ease;
      position: relative; overflow: hidden;
    }
    .btn::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn:hover::after { opacity: 1; }
    .btn:active { transform: scale(0.97); }

    .btn-primary {
      background: linear-gradient(135deg, #00c8d4, #0077ff);
      color: #fff; box-shadow: 0 4px 20px rgba(0,245,255,0.3);
    }
    .btn-primary:hover { box-shadow: 0 6px 30px rgba(0,245,255,0.5); transform: translateY(-1px); }

    .btn-danger {
      background: linear-gradient(135deg, #ff2d78, #c0004e);
      color: #fff; box-shadow: 0 4px 20px rgba(255,45,120,0.3);
    }
    .btn-danger:hover { box-shadow: 0 6px 30px rgba(255,45,120,0.5); transform: translateY(-1px); }

    .btn-green {
      background: linear-gradient(135deg, #39ff14, #00a300);
      color: #000; box-shadow: 0 4px 20px rgba(57,255,20,0.3);
    }
    .btn-green:hover { box-shadow: 0 6px 30px rgba(57,255,20,0.5); transform: translateY(-1px); }

    .btn-ghost {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-ghost:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

    .btn-lg { padding: 18px 48px; font-size: 1.3rem; }

    /* ── QUESTION TIMER ── */
    .q-timer-wrap {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      margin-bottom: 24px;
    }
    .q-timer-ring {
      width: 80px; height: 80px; position: relative;
    }
    .q-timer-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .q-timer-ring circle {
      fill: none; stroke-width: 5;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.4s linear, stroke 0.4s;
    }
    .q-timer-ring .bg-circle { stroke: rgba(255,255,255,0.07); }
    .q-timer-ring .fg-circle { stroke: var(--neon-cyan); filter: drop-shadow(0 0 4px var(--neon-cyan)); }
    .q-timer-ring .fg-circle.danger { stroke: var(--neon-magenta); filter: drop-shadow(0 0 4px var(--neon-magenta)); }
    .q-timer-num {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      font-family: 'Orbitron', monospace; font-size: 1.2rem; font-weight: 900;
      color: var(--neon-cyan); text-shadow: var(--glow-cyan);
    }
    .q-timer-num.danger { color: var(--neon-magenta); text-shadow: var(--glow-magenta); animation: pulse-danger 0.5s infinite alternate; }
    @keyframes pulse-danger { from { transform: scale(1); } to { transform: scale(1.15); } }

    /* ── Question header ── */
    .q-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .q-type-badge {
      font-family: 'Rajdhani', sans-serif; font-size: 0.8rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 2px;
      padding: 4px 12px; border-radius: 6px;
    }
    .badge-recognition { background: rgba(0,245,255,0.15); color: var(--neon-cyan); border: 1px solid rgba(0,245,255,0.3); }
    .badge-fill       { background: rgba(57,255,20,0.15);  color: var(--neon-green);  border: 1px solid rgba(57,255,20,0.3); }
    .badge-fix        { background: rgba(255,107,0,0.15);  color: var(--neon-orange); border: 1px solid rgba(255,107,0,0.3); }
    .badge-table      { background: rgba(191,95,255,0.15); color: var(--neon-purple); border: 1px solid rgba(191,95,255,0.3); }

    .q-theme-badge {
      font-family: 'Inter', sans-serif; font-size: 0.75rem;
      padding: 3px 10px; border-radius: 999px;
      background: rgba(255,230,0,0.1); color: var(--neon-yellow);
      border: 1px solid rgba(255,230,0,0.25);
    }

    /* ── Question sentence ── */
    .q-sentence {
      font-family: 'Rajdhani', sans-serif;
      font-size: clamp(1.1rem, 2.5vw, 1.5rem);
      font-weight: 600; line-height: 1.6;
      color: var(--text-primary);
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 24px;
      word-break: break-word;
    }
    .blank {
      display: inline-block;
      border-bottom: 2px solid var(--neon-cyan);
      min-width: 100px; color: transparent;
      user-select: none;
    }

    /* ── MC Options ── */
    .mc-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .mc-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 14px;
      min-height: 72px;
      font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600;
      color: var(--text-primary); text-align: center;
      cursor: pointer; transition: all 0.18s;
      display: flex; align-items: center; justify-content: center;
    }
    .mc-btn:hover:not(:disabled) {
      background: rgba(0,245,255,0.1);
      border-color: var(--neon-cyan);
      color: var(--neon-cyan);
    }
    .mc-btn.correct {
      background: rgba(57,255,20,0.15);
      border-color: var(--neon-green);
      color: var(--neon-green);
      box-shadow: var(--glow-green);
    }
    .mc-btn.wrong {
      background: rgba(255,45,120,0.15);
      border-color: var(--neon-magenta);
      color: var(--neon-magenta);
    }
    .mc-btn:disabled { cursor: default; }

    /* ── Fill-in input ── */
    .fill-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .fill-input {
      flex: 1; min-width: 200px;
      background: rgba(0,0,0,0.4);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      font-family: 'Rajdhani', sans-serif; font-size: 1.1rem; font-weight: 600;
      color: var(--text-primary);
      outline: none; transition: border-color 0.2s;
    }
    .fill-input:focus { border-color: var(--neon-cyan); box-shadow: 0 0 0 2px rgba(0,245,255,0.1); }
    .fill-input.shake { animation: shake 0.4s; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(5px)}
    }

    /* ── Fix question ── */
    .fix-sentence {
      display: flex; flex-wrap: wrap; gap: 6px;
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px; margin-bottom: 16px;
      font-family: 'Rajdhani', sans-serif; font-size: clamp(1rem, 2vw, 1.3rem); font-weight: 600;
    }
    .fix-word {
      font: inherit; background: transparent;
      padding: 4px 8px; border-radius: 6px;
      cursor: pointer; transition: all 0.15s;
      border: 1px solid transparent;
      color: var(--text-primary);
    }
    .fix-word:hover { background: rgba(255,107,0,0.15); border-color: var(--neon-orange); color: var(--neon-orange); }
    .fix-word.selected { background: rgba(255,107,0,0.25); border-color: var(--neon-orange); color: var(--neon-orange); animation: none; }
    .fix-correction { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
    .fix-hint { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px; }

    /* ── Table question ── */
    .tense-table {
      width: 100%; border-collapse: collapse; margin-bottom: 20px;
    }
    .tense-table th {
      font-family: 'Orbitron', monospace; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 1.5px; text-transform: uppercase;
      padding: 10px 14px; text-align: center;
      background: rgba(0,245,255,0.07);
      border: 1px solid var(--border);
      color: var(--neon-cyan);
    }
    .tense-table td {
      padding: 12px 14px; border: 1px solid var(--border);
      font-size: 0.85rem; line-height: 1.5;
      color: var(--text-primary); text-align: center;
      vertical-align: middle;
    }
    .tense-table .row-label {
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 0.95rem;
      background: rgba(191,95,255,0.07); color: var(--neon-purple);
      text-align: left; white-space: nowrap;
    }
    .tense-table .cell-filled { background: rgba(0,0,0,0.25); }
    .tense-table .cell-hidden {
      background: rgba(191,95,255,0.08);
      border: 1px dashed rgba(191,95,255,0.4);
    }
    .table-mc {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .table-mc .mc-btn {
      padding: 20px 16px;
      min-height: 90px;
      font-size: 0.9rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1.5;
    }

    /* ── Feedback overlay ── */
    .feedback-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none;
    }
    .feedback-toast {
      font-family: 'Orbitron', monospace; font-size: 2.5rem; font-weight: 900;
      padding: 20px 40px; border-radius: 18px;
      animation: toast-in 0.3s ease, toast-out 0.3s ease 0.7s forwards;
      pointer-events: none;
    }
    .feedback-toast.correct {
      color: var(--neon-green); background: rgba(57,255,20,0.1);
      border: 2px solid var(--neon-green); box-shadow: var(--glow-green);
    }
    .feedback-toast.wrong {
      color: var(--neon-magenta); background: rgba(255,45,120,0.1);
      border: 2px solid var(--neon-magenta); box-shadow: var(--glow-magenta);
    }
    @keyframes toast-in  { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes toast-out { from { opacity: 1; } to { opacity: 0; } }

    /* ── Progress bar ── */
    .progress-bar-wrap { width: 100%; max-width: 760px; margin-bottom: 12px; }
    .progress-bar-bg { background: var(--border); border-radius: 999px; height: 4px; overflow: hidden; }
    .progress-bar-fill {
      height: 100%; border-radius: 999px;
      background: linear-gradient(90deg, var(--neon-cyan), var(--neon-purple));
      box-shadow: 0 0 6px var(--neon-cyan);
      transition: width 0.4s ease;
    }

    /* ── GAME OVER / VICTORY ── */
    .end-screen { text-align: center; }
    .end-icon { font-size: 5rem; margin-bottom: 16px; display: block; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    .end-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.8rem, 4vw, 3rem); font-weight: 900;
      margin-bottom: 10px;
    }
    .end-title.defeat { color: var(--neon-magenta); text-shadow: var(--glow-magenta); }
    .end-title.victory { color: var(--neon-green); text-shadow: var(--glow-green); }
    .end-sub { font-family: 'Rajdhani', sans-serif; font-size: 1.2rem; color: var(--text-muted); margin-bottom: 28px; }
    .final-time {
      font-family: 'Orbitron', monospace; font-size: 2.5rem; font-weight: 900;
      color: var(--neon-yellow); text-shadow: var(--glow-yellow);
      margin-bottom: 28px;
    }

    /* ── Leaderboard ── */
    .leaderboard { margin-bottom: 28px; }
    .lb-title {
      font-family: 'Orbitron', monospace; font-size: 0.85rem; font-weight: 700;
      color: var(--neon-cyan); letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 14px;
    }
    .lb-row {
      display: flex; align-items: center; gap: 14px;
      padding: 10px 16px; border-radius: var(--radius);
      margin-bottom: 6px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      font-family: 'Rajdhani', sans-serif; font-size: 1rem; font-weight: 600;
    }
    .lb-row.highlight { border-color: var(--neon-yellow); background: rgba(255,230,0,0.08); }
    .lb-rank { font-family: 'Orbitron', monospace; font-size: 0.9rem; color: var(--text-muted); width: 24px; text-align: center; }
    .lb-rank.gold   { color: #ffd700; }
    .lb-rank.silver { color: #c0c0c0; }
    .lb-rank.bronze { color: #cd7f32; }
    .lb-time { font-family: 'Orbitron', monospace; font-size: 1.1rem; color: var(--neon-green); margin-left: auto; }
    .lb-date { font-size: 0.8rem; color: var(--text-muted); }
    .lb-empty { color: var(--text-dim); font-size: 0.9rem; padding: 16px 0; }

    /* ── Instruction text ── */
    .instruction {
      font-size: 0.9rem; color: var(--text-muted);
      margin-bottom: 16px; line-height: 1.5;
      display: flex; align-items: flex-start; gap: 8px;
    }
    .instruction::before { content: '→'; color: var(--neon-cyan); flex-shrink: 0; }

    /* ── Correct answer reveal ── */
    .answer-reveal {
      background: rgba(57,255,20,0.07);
      border: 1px solid rgba(57,255,20,0.3);
      border-radius: var(--radius);
      padding: 12px 16px; margin-top: 12px;
      font-family: 'Rajdhani', sans-serif; font-size: 0.95rem;
      color: var(--neon-green);
    }
    .answer-reveal strong { font-weight: 700; }

    /* ── Tense color chips ── */
    .tense-chip {
      display: inline-flex; align-items: center;
      padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700;
      font-family: 'Rajdhani', sans-serif; letter-spacing: 1px;
    }

    /* ── Misc ── */
    .mt-16 { margin-top: 16px; }
    .mt-24 { margin-top: 24px; }
    .flex-center { display: flex; justify-content: center; align-items: center; gap: 12px; }
    .w-full { width: 100%; }
    .text-sm { font-size: 0.85rem; }
    .text-muted { color: var(--text-muted); }

    /* Particle canvas */
    #particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  </style>
</head>
<body>
<canvas id="particles"></canvas>
<div id="root"></div>

<script type="module" src="./game.js"></script>
</body>
</html>
